name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Replay only: no API key exists in CI, and a missing cassette fails the test
      # rather than reaching the network (PHASE_1_MODEL_GATEWAY.md §5.2).
      - run: pytest -v  # honors testpaths in pyproject.toml (includes sentencing_agent/tests)
        env:
          MODEL_GATEWAY_MODE: replay

  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black==24.10.0 ruff==0.16.10
      - run: black --check src/ tests/
      - run: ruff check src/

  inventory:
    # docs/INVENTORY.md is generated from the tree; fail if it was not regenerated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/inventory.py --check

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx next lint
