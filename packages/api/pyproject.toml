[project]
name = "defender-ai-api"
version = "0.1.0"
description = "Public Defender AI Assistant — Agent Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.25.0",
    "langgraph>=0.0.40",
    "langchain-anthropic>=0.1.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "pypdf2>=3.0.0",
    "pytesseract>=0.3.10",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black==24.10.0",
    "ruff>=0.4.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src/agents/tier2_attorney/sentencing_agent/tests",
]
asyncio_mode = "auto"
